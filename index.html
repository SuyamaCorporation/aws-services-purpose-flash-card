<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWSサービス用途フラッシュカード学習</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .card-container { perspective: 1000px; }
  .card-inner {
    position: relative;
    width: 100%;
    height: 220px;
    transition: transform 0.6s;
    transform-style: preserve-3d;
    cursor: pointer;
  }
  .card-inner.flipped { transform: rotateY(180deg); }
  .card-front, .card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .card-back { transform: rotateY(180deg); }
</style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
<div class="max-w-2xl mx-auto px-4 py-6">
  <h1 class="text-2xl font-bold text-center text-yellow-400 mb-2">☁️ AWSフラッシュカード</h1>
  <p class="text-center text-gray-400 text-sm mb-4">クリックでカードを裏返す</p>

  <!-- Filter -->
  <div class="flex flex-wrap gap-2 justify-center mb-4">
    <button onclick="setCategory('all')" id="cat-all" class="cat-btn px-3 py-1 rounded-full text-sm bg-yellow-500 text-black font-semibold">すべて</button>
    <button onclick="setCategory('Compute')" id="cat-Compute" class="cat-btn px-3 py-1 rounded-full text-sm bg-gray-700 text-gray-200">Compute</button>
    <button onclick="setCategory('Storage')" id="cat-Storage" class="cat-btn px-3 py-1 rounded-full text-sm bg-gray-700 text-gray-200">Storage</button>
    <button onclick="setCategory('Database')" id="cat-Database" class="cat-btn px-3 py-1 rounded-full text-sm bg-gray-700 text-gray-200">Database</button>
    <button onclick="setCategory('Network')" id="cat-Network" class="cat-btn px-3 py-1 rounded-full text-sm bg-gray-700 text-gray-200">Network</button>
    <button onclick="setCategory('Security')" id="cat-Security" class="cat-btn px-3 py-1 rounded-full text-sm bg-gray-700 text-gray-200">Security</button>
    <button onclick="setCategory('Messaging')" id="cat-Messaging" class="cat-btn px-3 py-1 rounded-full text-sm bg-gray-700 text-gray-200">Messaging</button>
    <button onclick="setCategory('Management')" id="cat-Management" class="cat-btn px-3 py-1 rounded-full text-sm bg-gray-700 text-gray-200">Management</button>
    <button onclick="setCategory('AI/ML')" id="cat-AI/ML" class="cat-btn px-3 py-1 rounded-full text-sm bg-gray-700 text-gray-200">AI/ML</button>
    <button onclick="setCategory('苦手のみ')" id="cat-苦手のみ" class="cat-btn px-3 py-1 rounded-full text-sm bg-red-700 text-gray-200">苦手のみ</button>
  </div>

  <!-- Progress -->
  <div class="flex justify-between items-center text-sm text-gray-400 mb-3">
    <span id="progress-text">0 / 0</span>
    <span>苦手: <span id="nigate-count" class="text-red-400 font-bold">0</span></span>
    <span id="category-label" class="text-yellow-400">すべて</span>
  </div>

  <!-- Card -->
  <div class="card-container mb-4">
    <div class="card-inner" id="card" onclick="flipCard()" role="button" aria-label="カードを裏返す">
      <div class="card-front bg-gradient-to-br from-blue-800 to-blue-600 shadow-xl">
        <div id="card-category" class="text-xs text-blue-200 mb-2 px-3 py-1 bg-blue-900 rounded-full"></div>
        <div id="card-front-text" class="text-3xl font-bold text-white text-center"></div>
        <div class="text-blue-300 text-sm mt-4">タップで用途を確認</div>
      </div>
      <div class="card-back bg-gradient-to-br from-green-800 to-green-600 shadow-xl">
        <div id="card-back-category" class="text-xs text-green-200 mb-2 px-3 py-1 bg-green-900 rounded-full"></div>
        <div id="card-back-name" class="text-lg font-bold text-green-200 mb-2"></div>
        <div id="card-back-text" class="text-base text-white text-center leading-relaxed"></div>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="flex gap-2 justify-center mb-4 flex-wrap">
    <button onclick="prevCard()" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm" aria-label="前のカード">◀ 前</button>
    <button onclick="nextCard()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-sm" aria-label="次のカード">次 ▶</button>
    <button onclick="shuffleCards()" class="px-4 py-2 bg-purple-600 hover:bg-purple-500 rounded-lg text-sm" aria-label="シャッフル">🔀 シャッフル</button>
    <button onclick="toggleNigate()" id="nigate-btn" class="px-4 py-2 bg-gray-700 hover:bg-red-600 rounded-lg text-sm" aria-label="苦手に追加">⚡ 苦手追加</button>
  </div>

  <!-- Nigate list toggle -->
  <div class="mt-4">
    <button onclick="toggleNigateList()" class="text-sm text-gray-400 underline">苦手リストを表示/非表示</button>
    <div id="nigate-list" class="hidden mt-2 bg-gray-800 rounded-lg p-3 max-h-40 overflow-y-auto">
      <p class="text-xs text-gray-400 mb-2">苦手リスト（クリックで削除）:</p>
      <div id="nigate-items" class="flex flex-wrap gap-2"></div>
    </div>
  </div>
</div>

<script>
const AWS_SERVICES = [
  {name:'EC2',purpose:'仮想サーバーを提供するコンピューティングサービス。様々なOS・スペックのインスタンスを起動・管理できる',category:'Compute'},
  {name:'Lambda',purpose:'サーバー不要で関数を実行するFaaS。イベント駆動型で自動スケーリング、実行時間分だけ課金',category:'Compute'},
  {name:'ECS',purpose:'Dockerコンテナを管理・実行するオーケストレーションサービス。EC2またはFargateで動作',category:'Compute'},
  {name:'EKS',purpose:'Kubernetesをマネージドで提供するサービス。コンテナオーケストレーションの運用負荷を削減',category:'Compute'},
  {name:'Fargate',purpose:'サーバー管理不要でコンテナを実行するサーバーレスコンテナ実行環境',category:'Compute'},
  {name:'Elastic Beanstalk',purpose:'アプリケーションを簡単にデプロイ・管理するPaaSサービス。インフラ設定を自動化',category:'Compute'},
  {name:'Auto Scaling',purpose:'負荷に応じてEC2インスタンス数を自動で増減させる水平スケーリングサービス',category:'Compute'},
  {name:'S3',purpose:'オブジェクトストレージサービス。静的ファイル、バックアップ、データレイクとして活用。99.999999999%の耐久性',category:'Storage'},
  {name:'EBS',purpose:'EC2インスタンスにアタッチするブロックストレージ。高IOPS・低レイテンシのディスク',category:'Storage'},
  {name:'EFS',purpose:'複数のEC2インスタンスから同時アクセス可能なNFSマネージドファイルストレージ',category:'Storage'},
  {name:'S3 Glacier',purpose:'低コストの長期アーカイブストレージ。アクセス頻度が低いデータの保管に最適',category:'Storage'},
  {name:'Storage Gateway',purpose:'オンプレミスとAWSクラウドストレージを統合するハイブリッドストレージサービス',category:'Storage'},
  {name:'RDS',purpose:'MySQL・PostgreSQL・Oracle等のリレーショナルDBをマネージドで提供。自動バックアップ・パッチ適用',category:'Database'},
  {name:'DynamoDB',purpose:'フルマネージドNoSQLデータベース。ミリ秒レイテンシ、自動スケーリング、サーバーレス対応',category:'Database'},
  {name:'Aurora',purpose:'MySQL/PostgreSQL互換のRDBMS。標準より5倍高速、自動レプリケーションと高可用性',category:'Database'},
  {name:'ElastiCache',purpose:'RedisまたはMemcachedのインメモリキャッシュサービス。DBの負荷軽減と高速データアクセス',category:'Database'},
  {name:'Redshift',purpose:'ペタバイト規模のデータウェアハウス。大量データの分析クエリを高速処理',category:'Database'},
  {name:'Neptune',purpose:'グラフデータベースサービス。ソーシャルネットワーク・レコメンデーションエンジンに最適',category:'Database'},
  {name:'CloudFront',purpose:'グローバルCDNサービス。エッジロケーションからコンテンツを配信し低レイテンシを実現',category:'Network'},
  {name:'Route53',purpose:'スケーラブルなDNSウェブサービス。ドメイン登録・名前解決・ヘルスチェック機能',category:'Network'},
  {name:'VPC',purpose:'仮想プライベートクラウド。AWSリソースを論理的に分離したプライベートネットワーク環境',category:'Network'},
  {name:'API Gateway',purpose:'RESTful/WebSocket APIを作成・管理・公開するフルマネージドサービス',category:'Network'},
  {name:'Direct Connect',purpose:'オンプレミスとAWSを専用線で接続するネットワークサービス。高帯域・低レイテンシ',category:'Network'},
  {name:'ELB',purpose:'受信トラフィックを複数のターゲットに分散するロードバランサー(ALB/NLB/CLB)',category:'Network'},
  {name:'IAM',purpose:'AWSリソースへのアクセス権限を管理する認証・認可サービス。ユーザー・ロール・ポリシー管理',category:'Security'},
  {name:'KMS',purpose:'暗号化キーを作成・管理するフルマネージドサービス。AWSサービスとの統合暗号化',category:'Security'},
  {name:'WAF',purpose:'ウェブアプリケーションファイアウォール。SQLインジェクション・XSS等の攻撃を防御',category:'Security'},
  {name:'Shield',purpose:'DDoS攻撃から保護するマネージドサービス。Shield StandardとAdvancedの2段階',category:'Security'},
  {name:'Cognito',purpose:'ウェブ・モバイルアプリの認証・認可・ユーザー管理サービス。SNSログイン連携',category:'Security'},
  {name:'GuardDuty',purpose:'機械学習を使った脅威検出サービス。異常なAPIコール・不審なIPアクセスを自動検出',category:'Security'},
  {name:'SQS',purpose:'フルマネージドメッセージキューサービス。マイクロサービス間の非同期通信・デカップリング',category:'Messaging'},
  {name:'SNS',purpose:'Pub/Sub型メッセージング。トピックへの発行で複数サブスクライバー(Lambda/SQS/Email等)に配信',category:'Messaging'},
  {name:'EventBridge',purpose:'イベントバスサービス。AWSサービスやSaaSのイベントをルーティングしてワークフロー自動化',category:'Messaging'},
  {name:'Kinesis',purpose:'リアルタイムデータストリーミング。ログ・動画・IoTデータをリアルタイム処理・分析',category:'Messaging'},
  {name:'CloudWatch',purpose:'AWSリソースのモニタリング・ログ収集・アラート設定。メトリクスダッシュボード作成',category:'Management'},
  {name:'CloudTrail',purpose:'AWSアカウント内のAPI操作履歴を記録・監査するサービス。セキュリティ監査に必須',category:'Management'},
  {name:'CloudFormation',purpose:'インフラをコードで定義・プロビジョニングするIaC(Infrastructure as Code)サービス',category:'Management'},
  {name:'Systems Manager',purpose:'EC2・オンプレサーバーの運用管理。パッチ適用・設定管理・インベントリ収集を自動化',category:'Management'},
  {name:'SageMaker',purpose:'機械学習モデルの構築・学習・デプロイをエンドツーエンドで提供するMLプラットフォーム',category:'AI/ML'},
  {name:'Rekognition',purpose:'画像・動画の分析AIサービス。顔認識・物体検出・テキスト抽出・不適切コンテンツ検出',category:'AI/ML'},
  {name:'Comprehend',purpose:'自然言語処理(NLP)サービス。感情分析・エンティティ抽出・言語検出・トピック分類',category:'AI/ML'},
  {name:'Textract',purpose:'ドキュメントからテキスト・データを自動抽出するAIサービス。PDF・画像対応',category:'AI/ML'},
  {name:'Bedrock',purpose:'FMベースのAI機能をAPIで提供。Claude・Llama等のFoundation Modelを活用したアプリ開発',category:'AI/ML'},
  {name:'Step Functions',purpose:'マイクロサービスをビジュアルなワークフローで連携するオーケストレーションサービス',category:'Management'},
];

let deck = [...AWS_SERVICES];
let currentIndex = 0;
let currentCategory = 'all';
let nigate = JSON.parse(localStorage.getItem('aws-nigate') || '[]');
let isFlipped = false;

function getDeck() {
  if (currentCategory === 'all') return [...AWS_SERVICES];
  if (currentCategory === '苦手のみ') return AWS_SERVICES.filter(s => nigate.includes(s.name));
  return AWS_SERVICES.filter(s => s.category === currentCategory);
}

function setCategory(cat) {
  currentCategory = cat;
  deck = getDeck();
  currentIndex = 0;
  document.querySelectorAll('.cat-btn').forEach(b => {
    b.className = b.className.replace('bg-yellow-500 text-black font-semibold', 'bg-gray-700 text-gray-200');
  });
  const btn = document.getElementById('cat-' + cat);
  if (btn) btn.className = btn.className.replace('bg-gray-700 text-gray-200', 'bg-yellow-500 text-black font-semibold');
  document.getElementById('category-label').textContent = cat === 'all' ? 'すべて' : cat;
  showCard();
}

function showCard() {
  const card = document.getElementById('card');
  card.classList.remove('flipped');
  isFlipped = false;
  if (deck.length === 0) {
    document.getElementById('card-front-text').textContent = 'カードなし';
    document.getElementById('card-back-text').textContent = '';
    document.getElementById('progress-text').textContent = '0 / 0';
    return;
  }
  const s = deck[currentIndex];
  document.getElementById('card-front-text').textContent = s.name;
  document.getElementById('card-category').textContent = s.category;
  document.getElementById('card-back-name').textContent = s.name;
  document.getElementById('card-back-category').textContent = s.category;
  document.getElementById('card-back-text').textContent = s.purpose;
  document.getElementById('progress-text').textContent = (currentIndex + 1) + ' / ' + deck.length;
  const nigateBtn = document.getElementById('nigate-btn');
  if (nigate.includes(s.name)) {
    nigateBtn.textContent = '✅ 苦手解除';
    nigateBtn.className = nigateBtn.className.replace('bg-gray-700', 'bg-red-700');
  } else {
    nigateBtn.textContent = '⚡ 苦手追加';
    nigateBtn.className = nigateBtn.className.replace('bg-red-700', 'bg-gray-700');
  }
}

function flipCard() {
  const card = document.getElementById('card');
  isFlipped = !isFlipped;
  card.classList.toggle('flipped', isFlipped);
}

function nextCard() {
  currentIndex = (currentIndex + 1) % deck.length;
  showCard();
}

function prevCard() {
  currentIndex = (currentIndex - 1 + deck.length) % deck.length;
  showCard();
}

function shuffleCards() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  currentIndex = 0;
  showCard();
}

function toggleNigate() {
  if (deck.length === 0) return;
  const name = deck[currentIndex].name;
  const idx = nigate.indexOf(name);
  if (idx >= 0) nigate.splice(idx, 1);
  else nigate.push(name);
  localStorage.setItem('aws-nigate', JSON.stringify(nigate));
  document.getElementById('nigate-count').textContent = nigate.length;
  renderNigateItems();
  showCard();
}

function toggleNigateList() {
  const el = document.getElementById('nigate-list');
  el.classList.toggle('hidden');
}

function renderNigateItems() {
  const container = document.getElementById('nigate-items');
  while (container.firstChild) container.removeChild(container.firstChild);
  nigate.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'px-2 py-1 bg-red-800 rounded text-xs text-red-200 hover:bg-red-700';
    btn.textContent = name + ' ✕';
    btn.setAttribute('aria-label', name + 'を苦手リストから削除');
    btn.onclick = () => {
      nigate = nigate.filter(n => n !== name);
      localStorage.setItem('aws-nigate', JSON.stringify(nigate));
      document.getElementById('nigate-count').textContent = nigate.length;
      if (currentCategory === '苦手のみ') { deck = getDeck(); currentIndex = 0; }
      renderNigateItems();
      showCard();
    };
    container.appendChild(btn);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') nextCard();
  else if (e.key === 'ArrowLeft') prevCard();
  else if (e.key === ' ') { e.preventDefault(); flipCard(); }
});

deck = getDeck();
document.getElementById('nigate-count').textContent = nigate.length;
renderNigateItems();
showCard();
</script>
</body>
</html>
